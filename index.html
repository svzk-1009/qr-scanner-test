
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>部品一括登録テスト</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 12px;
      color: #222;
    }

    h2 { margin: 4px 0 8px; font-size: 21px; }
    h3 { margin: 12px 0 8px; font-size: 17px; }
    p { margin: 6px 0; }

    button, input {
      font-size: 16px;
      padding: 9px;
      border-radius: 6px;
    }

    button { cursor: pointer; }
    button:disabled { opacity: 0.5; }

    .camera-controls {
      display: flex;
      gap: 8px;
      margin: 10px 0;
    }

    .camera-controls button { flex: 1; }

    #reader {
      width: 100%;
      max-width: 340px;
      margin: 8px auto;
    }

    #reader video {
      max-height: 260px;
      object-fit: cover;
    }

    #status {
      padding: 10px;
      border-radius: 8px;
      background: #f1f1f1;
      overflow-wrap: anywhere;
      font-size: 14px;
    }

    #status.success {
      background: #e0f5e6;
      color: #155b2b;
      font-weight: bold;
    }

    .manual {
      display: flex;
      gap: 8px;
      margin: 8px 0;
    }

    .manual input { flex: 1; min-width: 0; }
    .manual button { flex-shrink: 0; }

    .list-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    #count {
      font-size: 14px;
      font-weight: normal;
      color: #555;
    }

    #list {
      max-height: 220px;
      overflow-y: auto;
      border-top: 1px solid #ddd;
      border-bottom: 1px solid #ddd;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 2px;
      border-bottom: 1px solid #eee;
    }

    .item-id {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
      font-weight: bold;
      font-size: 14px;
    }

    .item input {
      width: 65px;
      padding: 7px 4px;
    }

    .item button {
      padding: 7px;
      font-size: 14px;
    }

    #confirmButton {
      width: 100%;
      margin-top: 12px;
    }

    #confirmResult {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #f3f3f3;
      padding: 10px;
      border-radius: 8px;
      margin-top: 8px;
      font-size: 14px;
    }

    .note {
      font-size: 12px;
      color: #666;
    }
  </style>
</head>
<body>
  <h2>部品一括登録テスト</h2>
  <p class="note">この画面では実際の在庫数は変更されません。</p>

  <div class="camera-controls">
    <button id="startButton">カメラを起動</button>
    <button id="stopButton" disabled>カメラを停止</button>
  </div>

  <div id="reader"></div>
  <p id="status" aria-live="polite">カメラ停止中</p>

  <h3>部品IDを手入力</h3>
  <div class="manual">
    <input id="manualId" placeholder="部品IDを入力">
    <button id="addManual">追加</button>
  </div>

  <div class="list-heading">
    <h3>仮リスト</h3>
    <span id="count">0種類・合計0個</span>
  </div>

  <div id="list"></div>

  <button id="confirmButton">登録内容を確認</button>
  <div id="confirmResult"></div>

  <script>
    const items = [];
    let scanner = null;
    let starting = false;
    let lastScannedId = "";
    let lastScannedAt = 0;

    const status = document.getElementById("status");
    const listElement = document.getElementById("list");
    const countElement = document.getElementById("count");
    const startButton = document.getElementById("startButton");
    const stopButton = document.getElementById("stopButton");
    const confirmResult = document.getElementById("confirmResult");

    function showStatus(message, success = false) {
      status.textContent = message;
      status.classList.toggle("success", success);
    }

    function addItem(rawId, source = "manual") {
      const id = rawId.trim();
      if (!id) return;

      const now = Date.now();

      // カメラによる同一QRの連続検出を2秒間だけ無視する
      if (
        source === "camera" &&
        id === lastScannedId &&
        now - lastScannedAt < 2000
      ) {
        return;
      }

      if (source === "camera") {
        lastScannedId = id;
        lastScannedAt = now;
      }

      const existing = items.find(item => item.id === id);

      if (existing) {
        existing.qty += 1;
      } else {
        items.push({ id, qty: 1 });
      }

      renderList(id);

      showStatus(
        "✓ 読み取り成功！\n部品ID：" + id +
        "\n仮リストに追加しました。",
        true
      );

      confirmResult.textContent = "";
    }

    function renderList(newId = "") {
      listElement.replaceChildren();

      const totalQty = items.reduce((sum, item) => sum + item.qty, 0);
      countElement.textContent =
        items.length + "種類・合計" + totalQty + "個";

      items.forEach((item, index) => {
        const row = document.createElement("div");
        row.className = "item";

        const idText = document.createElement("span");
        idText.className = "item-id";
        idText.textContent = item.id;
        row.appendChild(idText);

        const qtyInput = document.createElement("input");
        qtyInput.type = "number";
        qtyInput.min = "1";
        qtyInput.step = "1";
        qtyInput.value = item.qty;
        qtyInput.setAttribute("aria-label", item.id + "の数量");

        qtyInput.addEventListener("change", () => {
          const qty = Number(qtyInput.value);

          if (!Number.isInteger(qty) || qty < 1) {
            alert("数量は1以上の整数にしてください。");
            qtyInput.value = item.qty;
            return;
          }

          item.qty = qty;
          renderList();
          confirmResult.textContent = "";
        });

        row.appendChild(qtyInput);

        const removeButton = document.createElement("button");
        removeButton.textContent = "削除";
        removeButton.addEventListener("click", () => {
          items.splice(index, 1);
          renderList();
          confirmResult.textContent = "";
        });

        row.appendChild(removeButton);
        listElement.appendChild(row);
      });

      // 新しく追加した部品がリストに見える位置へ移動
      if (newId) {
        const rows = listElement.querySelectorAll(".item");
        const newIndex = items.findIndex(item => item.id === newId);
        if (newIndex >= 0 && rows[newIndex]) {
          rows[newIndex].scrollIntoView({
            block: "nearest",
            behavior: "smooth"
          });
        }
      }
    }

    startButton.addEventListener("click", async () => {
      if (scanner || starting) return;

      starting = true;
      startButton.disabled = true;
      showStatus("カメラを起動しています…");

      try {
        scanner = new Html5Qrcode("reader");

        await scanner.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 200, height: 200 } },
          decodedText => addItem(decodedText, "camera"),
          () => {}
        );

        stopButton.disabled = false;
        showStatus("読み取り中です。QRコードをかざしてください。");
      } catch (error) {
        showStatus("カメラ起動エラー：" + error);

        if (scanner) {
          try { await scanner.clear(); } catch (e) {}
          scanner = null;
        }

        startButton.disabled = false;
      } finally {
        starting = false;
      }
    });

    stopButton.addEventListener("click", async () => {
      if (!scanner) return;

      try {
        await scanner.stop();
        await scanner.clear();
      } catch (error) {
        showStatus("停止時のエラー：" + error);
      }

      scanner = null;
      startButton.disabled = false;
      stopButton.disabled = true;
      showStatus("カメラ停止中");
    });

    document.getElementById("addManual").addEventListener("click", () => {
      const input = document.getElementById("manualId");
      const id = input.value.trim();

      if (!id) {
        alert("部品IDを入力してください。");
        return;
      }

      addItem(id, "manual");
      input.value = "";
    });

    document.getElementById("manualId").addEventListener("keydown", event => {
      if (event.key === "Enter") {
        document.getElementById("addManual").click();
      }
    });

    document.getElementById("confirmButton").addEventListener("click", () => {
      if (items.length === 0) {
        confirmResult.textContent = "仮リストは空です。";
        return;
      }

      confirmResult.textContent =
        "登録内容（確認用）\n\n" +
        items.map(item => item.id + " × " + item.qty).join("\n") +
        "\n\n※ 実際の在庫数は変更されていません。";
    });

    renderList();
  </script>
</body>
</html>
